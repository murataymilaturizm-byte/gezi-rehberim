<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dekoratif daireler -->
  <circle cx="1020" cy="95"  r="264" fill="white" fill-opacity="0.07"/>
  <circle cx="120"  cy="535" r="216" fill="white" fill-opacity="0.05"/>
  <circle cx="600"  cy="315" r="420" fill="white" fill-opacity="0.03"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.09"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- WhatsApp mesaj balonu ikonu -->
  <circle cx="600" cy="178" r="68" fill="white" fill-opacity="0.15"/>
  <text x="600" y="204" font-family="system-ui" font-size="60" text-anchor="middle" dominant-baseline="middle">💬</text>

  <!-- Ana başlık -->
  <text x="600" y="304" font-family="system-ui,-apple-system,sans-serif" font-size="74" font-weight="800" text-anchor="middle" fill="white" filter="url(#shadow)">Turzz AI</text>

  <!-- Alt başlık -->
  <text x="600" y="376" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="white" fill-opacity="0.88">Seyahat Acenteleri için WhatsApp Chatbot</text>

  <!-- Özellik badge'leri -->
  <rect x="296" y="432" width="176" height="44" rx="22" fill="white" fill-opacity="0.18"/>
  <text x="384" y="459" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="white">7 Dil Desteği</text>

  <rect x="508" y="432" width="184" height="44" rx="22" fill="white" fill-opacity="0.18"/>
  <text x="600" y="459" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="white">7/24 Otomatik</text>

  <rect x="728" y="432" width="176" height="44" rx="22" fill="white" fill-opacity="0.18"/>
  <text x="816" y="459" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="white">AI Destekli</text>

  <!-- URL -->
  <text x="600" y="578" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle" fill="white" fill-opacity="0.55">turzzai.com</text>
</svg>
