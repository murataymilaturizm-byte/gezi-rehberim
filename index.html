<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Arabic font (Cairo) — yalnızca dir=rtl olduğunda tarayıcı yükler -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Meta/OG/Twitter/canonical: SEOHead (vite-react-ssg Head) sayfa-bazlı üretir.
         Statik meta'lar 2026-07-25 SSG'de kaldırıldı (Head-inject ile çiftleniyordu). -->
    <meta name="author" content="Turzz AI" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- JSON-LD Organization Schema (sitewide, ham HTML — kanonik host: apex) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Turzz AI",
      "url": "https://turzzai.com",
      "logo": "https://turzzai.com/favicon.png",
      "description": "Seyahat acenteleri için WhatsApp chatbot ve AI destekli tur rezervasyon yazılımı.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "info@turzzai.com",
        "contactType": "customer support",
        "availableLanguage": ["Turkish", "English"]
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD SoftwareApplication Schema (sitewide, ham HTML — SEO/GEO ürün sinyali) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Turzz AI",
      "url": "https://turzzai.com",
      "description": "Seyahat acenteleri ve tur operatörleri için WhatsApp tabanlı, yapay zeka destekli rezervasyon chatbot'u. 7 dilde 7/24 otomatik tur satışı, rezervasyon yönetimi ve çok dilli müşteri hizmetleri.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "inLanguage": "tr",
      "offers": {
        "@type": "Offer",
        "price": "3999",
        "priceCurrency": "TRY",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "3999",
          "priceCurrency": "TRY",
          "unitText": "MONTH"
        }
      },
      "publisher": {
        "@type": "Organization",
        "name": "Turzz AI",
        "url": "https://turzzai.com"
      }
    }
    </script>

    <!-- Meta Pixel: consent-aware olarak src/components/MetaPixel.tsx üzerinden yükleniyor.
         Kullanıcı "marketing" çerezlerine onay vermeden Pixel ÇALIŞMAZ. GDPR uyumlu. -->

    <!-- Theme persistence -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (!theme && prefersDark);
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
